name: CI - Code Quality, Tests & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend Checks (Prisma, Types & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install shared dependencies
        run: |
          cd ../shared && npm install --no-audit

      - name: Install backend dependencies
        run: npm install --no-audit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check backend
        run: npx tsc --noEmit

      - name: Run backend tests
        run: npm test -- --ci --coverage --maxWorkers=2
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          FRONTEND_URL: http://localhost:3000

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  frontend-check:
    name: Frontend Checks (Lint, Types, Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install shared dependencies
        run: |
          cd ../shared && npm install --no-audit

      - name: Install frontend dependencies
        run: npm install --no-audit

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint || true

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.arijitde.com
          NODE_ENV: production
